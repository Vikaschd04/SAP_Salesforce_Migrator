# h2a-mvp configuration
# ─────────────────────
# provider:
#   anthropic  → real Claude calls           (needs ANTHROPIC_API_KEY)   — best quality
#   openrouter → free/cheap models via OpenRouter (needs OPENROUTER_API_KEY) — dev/testing
#   mock       → deterministic keyless stub   (no key)                    — CI / dry runs
#
# Same pipeline, prompts, schema grounding, and validation for every provider —
# only the underlying LLM changes.
provider: anthropic
model: claude-opus-4-8        # used when provider=anthropic

# Used when provider=openrouter. Pick any model from https://openrouter.ai/models
# (":free" suffix = free tier). Override per-run with H2A_CUSTOM_MODEL / the
# extension's "customModel" setting.
openrouter:
  base_url: https://openrouter.ai/api/v1
  # Free tiers change often & rate-limit; if one 404s/429s, pick another from
  # https://openrouter.ai/models?max_price=0 (code-capable ones work best).
  model: anthropic/claude-sonnet-5

cache_dir: cache/
mappings_file: mappings/hybris_to_apex.yaml
incremental: true
max_repair_attempts: 2

# How many LLM-bound units of work run at once (agentic engine).
#   Comprehend is fully parallel; Build+Critic runs one dependency "wavefront" at a
#   time, parallel within it. Output is identical to a sequential run — results are
#   merged in deterministic order — this only changes wall-clock time.
#   Raise for big repos + generous rate limits; set 1 to force sequential.
#   Override per-run with H2A_CONCURRENCY.
concurrency: 8

# Resilience. At ~900 LLM calls for a large repo, rare failures become certainties:
# a single 429 or 503 must not cost the whole run.
#   sdk_max_retries — retries inside the provider SDK (it already does correct
#                     exponential backoff on 408/409/429/5xx and connection errors)
#   max_attempts    — additional app-level attempts on top, with jittered backoff,
#                     for the case where the SDK exhausts its own retries
#   request_timeout — seconds per call; prevents one wedged request stalling a wavefront
#   checkpoint      — persist reusable state as the run progresses, so an interrupted
#                     run resumes instead of restarting (needs `incremental: true`)
resilience:
  sdk_max_retries: 3
  max_attempts: 4
  base_delay: 2.0
  max_delay: 60.0
  request_timeout: 600
  checkpoint: true

# Cost reporting. Rates are USD per 1,000,000 tokens; the built-in table in
# src/pricing.py covers the current Claude models, and anything listed here
# overrides it — so a price change (or a negotiated rate) needs no code edit.
# Models with no known rate are reported as "unpriced" rather than guessed.
pricing:
  models: {}
    # claude-opus-4-8:  {input: 5.00,  output: 25.00}
    # claude-haiku-4-5: {input: 1.00,  output: 5.00}

# Prompt slimming. Strips import blocks and provably-trivial getters/setters from the
# source sent to the model, keeping all logic AND all javadoc verbatim (javadoc is a
# quarter of the bytes here and it is where business rules are usually written down).
#
# Savings depend entirely on the codebase. Measured: ~9% end-to-end on the hand-written
# demo, but 74% on a realistic generated Hybris *Model class — and a real estate is
# mostly those. Falls back to the untouched source whenever anything looks off.
# Override per-run with H2A_SLIM_PROMPTS=0 to compare against the baseline.
prompts:
  slim: true

# Adaptive-thinking effort per stage (Anthropic only; ignored by other providers)
effort:
  comprehend: low
  generate: high

# Output token budgets per stage
max_tokens:
  comprehend: 800
  generate: 8000        # large fflib test classes need headroom to avoid truncation

# Behavioral parity: after generation, add test assertions for any comprehended
# business rule the tests don't yet check (skipped for the mock provider).
parity:
  strengthen: true
  max_attempts: 1

# Phase 1 — agentic core (used by the `agent-migrate` command; the linear
# `repo-migrate` path ignores this block).
agentic:
  critic: true               # run the adversarial Critic review gate on each artifact
  rag:                       # ground generation + review in bundled Salesforce docs
    enabled: true            # lexical retrieval over src/agentic/knowledge/*.md (no deps)
    top_k: 3                 # how many doc chunks to inject per prompt
  routing:                   # per-task model routing (anthropic only; saves cost)
    # ON by default: comprehension and planning are classification-ish and do fine
    # on the cheap tier, while generation/repair/critique earn a frontier model.
    # Measured saving is ~20% on a typical mix — generation and critique carry most
    # of the tokens and stay on the frontier tier, so routing alone is a trim, not a
    # halving. (Incremental re-runs and prompt slimming are the bigger cost levers.)
    # Set false to run every stage on `model:` above.
    enabled: true
    models:
      cheap: claude-haiku-4-5     # $1 / $5 per 1M tokens
      frontier: claude-opus-4-8   # $5 / $25 per 1M tokens
    tiers:                   # which tier each task family uses
      comprehend: cheap
      plan: cheap
      generate: frontier
      repair: frontier
      critic: frontier
      strengthen: frontier
      parity: frontier

# Frontend migration: discover SAP Spartacus / Angular components (*.component.ts)
# and convert each into a Lightning Web Component (LWC) bundle + @AuraEnabled Apex.
frontend:
  enabled: true            # set false to ignore frontend files (backend-only runs)

# Optional real compile/deploy verification via the Salesforce CLI, with a
# self-healing loop: real compiler errors are fed back into the LLM repair loop
# and the offending classes are rewritten + re-deployed until they compile.
# Requires `sf` on PATH and an authorised org (`sf org login web`).
verify:
  deploy: false            # set true (or pass --verify) to dry-run deploy the output
  run_tests: false         # also run generated Apex tests for coverage
  target_org: ""           # org alias/username; empty uses the default org
  auto_repair: true        # feed deploy errors back into repair + re-deploy (self-heal)
  max_deploy_attempts: 2   # max heal rounds (deploy → repair → re-deploy) before giving up
  coverage_threshold: 75   # if run_tests, strengthen tests until coverage ≥ this %% (Salesforce's min)
