<section class="cart">
  <h1>Your cart</h1>

  <p *ngIf="isEmpty" class="cart__empty">Your cart is empty.</p>

  <table class="cart__table" *ngIf="!isEmpty">
    <thead>
      <tr>
        <th>Product</th>
        <th>Price</th>
        <th>Qty</th>
        <th>Line total</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of items">
        <td>{{ item.product.name }}</td>
        <td>{{ item.product.price | currency: item.product.currency }}</td>
        <td>{{ item.quantity }}</td>
        <td>{{ lineTotal(item) | currency: item.product.currency }}</td>
        <td>
          <button class="cart__remove" (click)="remove(item.product.code)">Remove</button>
        </td>
      </tr>
    </tbody>
  </table>

  <footer class="cart__footer" *ngIf="!isEmpty">
    <p class="cart__total">Total: {{ total | currency }}</p>
    <button class="cart__checkout" (click)="onCheckout()">Checkout</button>
  </footer>
</section>
