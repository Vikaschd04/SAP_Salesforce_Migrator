<section class="product-list">
  <header class="product-list__header">
    <h1>Products</h1>
    <input
      type="search"
      class="product-list__search"
      placeholder="Search products…"
      [value]="query"
      (input)="onSearch($any($event.target).value)"
    />
    <div class="product-list__sort">
      <button (click)="changeSort('name')" [class.active]="sortBy === 'name'">Name</button>
      <button (click)="changeSort('price')" [class.active]="sortBy === 'price'">Price</button>
    </div>
  </header>

  <p *ngIf="loading" class="product-list__loading">Loading products…</p>

  <p *ngIf="!loading && filtered.length === 0" class="product-list__empty">
    No products match “{{ query }}”.
  </p>

  <ul class="product-list__grid" *ngIf="!loading">
    <li class="product-card" *ngFor="let product of filtered; trackBy: trackByCode">
      <img class="product-card__image" [src]="product.imageUrl" [alt]="product.name" />
      <h2 class="product-card__name">{{ product.name }}</h2>
      <p class="product-card__price">{{ product.price | currency: product.currency }}</p>
      <p class="product-card__stock" *ngIf="product.stockLevel === 0">Out of stock</p>
      <button
        class="product-card__add"
        [disabled]="product.stockLevel === 0"
        (click)="addToCart(product)"
      >
        Add to cart
      </button>
    </li>
  </ul>
</section>
