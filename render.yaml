# Render Blueprint — one-click deploy of the H2A Migration Cockpit.
# In Render: New + → Blueprint → connect this repo → Apply.
services:
  - type: web
    name: h2a-cockpit
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free                 # free instances sleep after ~15 min idle (cold start on next hit)
    region: oregon
    healthCheckPath: /api/health
    autoDeploy: true           # redeploys on every push to the connected branch
    envVars:
      - key: H2A_PROVIDER       # keyless, deterministic demo by default (no cost, no abuse)
        value: mock
      - key: H2A_HOSTED         # restrict input paths to bundled samples / uploads
        value: "1"
      # H2A_HOSTED=1 also turns authentication on. The first person to reach the URL
      # creates the admin account; registration then closes. To let colleagues sign up,
      # set H2A_ALLOW_SIGNUP=1 — do not leave it on for a public URL.
      - key: H2A_DB_PATH        # accounts + run history; point at a disk to keep them
        value: /var/data/h2a/runs.db
      - key: H2A_MAX_CONCURRENT_RUNS   # admission cap; each run holds a Blackboard in
        value: "3"                     # memory and fans out to parallel LLM calls
      # Required to store per-tenant API keys. Generate a long random value and set it
      # in the dashboard (sync:false keeps it out of the repo). Without it, key storage
      # stays off and every run uses the server's shared credential.
      # - key: H2A_SECRET_KEY
      #   sync: false
      # To enable real AI on the hosted app, add ONE of these in the Render dashboard
      # (Environment tab) and set H2A_PROVIDER accordingly — note: anyone with the URL
      # would then spend your credits, so prefer keeping it on mock or adding auth.
      # - key: ANTHROPIC_API_KEY
      #   sync: false
      # - key: OPENROUTER_API_KEY
      #   sync: false
