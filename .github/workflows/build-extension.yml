name: Build VSIX

# Builds the installable VS Code extension package (.vsix) on GitHub's runners.
#   • Every push to main (or a manual run) → the .vsix is uploaded as a downloadable
#     build artifact you can grab from the run's summary page.
#   • Pushing a version tag (e.g. v0.8.0) → the .vsix is also attached to a GitHub
#     Release, giving a permanent download link on the Releases page.
#
# vsce runs here in CI, so nothing needs to be built or published from a laptop.

on:
  push:
    branches: [main]
    paths:
      - 'h2a-vscode-extension/**'
      - '.github/workflows/build-extension.yml'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: h2a-vscode-extension
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Compile TypeScript
        run: npm run compile

      - name: Package extension (.vsix)
        # vsce reads publisher/version from package.json → h2a-vscode-extension-<version>.vsix
        run: npx --yes @vscode/vsce package --no-dependencies

      - name: Upload .vsix as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: h2a-vscode-extension-vsix
          path: h2a-vscode-extension/*.vsix
          if-no-files-found: error

      - name: Attach .vsix to the GitHub Release (on version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" ./*.vsix \
            --title "${GITHUB_REF_NAME}" \
            --notes "Installable VS Code extension package. Download the .vsix and install with: code --install-extension <file>.vsix" \
          || gh release upload "${GITHUB_REF_NAME}" ./*.vsix --clobber
